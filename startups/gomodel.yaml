name: GoModel
tagline: A self-hosted gateway for routing requests across AI providers
description: >-
  GoModel is an open-source AI gateway that exposes OpenAI- and Anthropic-compatible
  APIs in front of multiple model providers. Teams can run it as a single binary,
  apply per-request routing and guardrail rules, and track usage, budgets and audit
  data without putting provider-specific logic into each application.
problem: AI applications that use several model providers need one place to manage routing, reliability, cost controls and request-level observability.
audience:
  - Developers building applications on multiple AI model providers
  - Platform teams operating shared AI infrastructure
